name: Build
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '25.8.1'
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
  
  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: CodeQL Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v4
        with:
          wait-for-processing: false
          upload: false
