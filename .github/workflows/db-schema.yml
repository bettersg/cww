name: Supabase Schema
on:
  pull_request:
    branches:
      - staging
      - production
    paths:
      - 'src/supabase/schemas/**'
      - 'src/supabase/migrations/**'
  push:
    branches:
      - staging
      - production
    paths:
      - 'src/supabase/schemas/**'
      - 'src/supabase/migrations/**'

jobs:
  supabase-schema:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - name: Link Supabase project
        working-directory: ./src
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Schema push dry-run
        id: dry_run
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ./src
        run: supabase db push --dry-run --linked
      - name: Schema push
        if: ${{ github.event_name == 'push' }}
        working-directory: ./src
        run: supabase db push --linked
