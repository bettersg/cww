name: Reusable frontend deploy
on:
  workflow_call:
    inputs:
      firebase_site:
        required: true
        type: string
      firebase_target:
        required: true
        type: string
      environment:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '25.8.1'
    outputs:
      build-status:
        description: "The status of the build job"
        value: ${{ jobs.build.outputs.status }}
jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
        # todo: inject VITE env vars during build step
      - uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}"
          projectId: "${{ vars.FIREBASE_PROJECT_ID }}"
          target: ${{ inputs.firebase_target }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
