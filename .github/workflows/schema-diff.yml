name: Supabase Schema
on:
  pull_request:
    paths:
      - 'src/supabase/schemas/**'
      - 'src/supabase/migrations/**'
  push:
    branches:
      - main
    paths:
      - 'src/supabase/schemas/**'
      - 'src/supabase/migrations/**'

jobs:
  supabase-schema:
    name: Supabase Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        working-directory: ./src
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}
      - name: Schema pull
        working-directory: ./src
        run: supabase db pull
      - name: Schema diff
        working-directory: ./src
        run: supabase db diff --linked
      - name: Schema push dry-run
        id: dry_run
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ./src
        run: supabase db push --dry-run --linked
      - name: Create PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.number }}
          body: |
            Build output:
            ${{ steps.dry_run.outputs.stdout }}
      - name: Schema push
        if: ${{ github.event_name == 'push' }}
        working-directory: ./src
        run: supabase db push --linked
